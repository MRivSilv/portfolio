<main class="page-shell">
  <div class="ambient ambient-primary"></div>
  <div class="ambient ambient-secondary"></div>

  <header class="topbar">
    <div class="brand">
      <span class="material-symbols-outlined brand-icon">terminal</span>
      <span>{{ content().brand }}</span>
    </div>

    <nav class="topnav" aria-label="Navegación principal">
      <a href="#inicio" routerLink="/">Inicio</a>
      <a href="#habilidades">Habilidades</a>
      <a href="#proyectos">Proyectos</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <router-outlet></router-outlet>

  <footer class="footer">
    <div>
      <strong>{{ content().brand }}</strong>
      <span>{{ content().profile.role }}</span>
    </div>
    <div class="footer-links">
      <a *ngFor="let link of content().links" [href]="link.url">{{ link.label }}</a>
    </div>
  </footer>
</main>
